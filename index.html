<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Live Sprint - Sumaya Uddin</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="site-header">
      <h1 class="title">
        Welcome to the Interactive Reveal What’s that Animal UI
      </h1>
      <h2 class="subtitle">
        Click on the buttons below to reveal the animal images.
      </h2>
    </header>
    <main class="site-content">
      <div class="images">
        <div id="cat-img" class="card hidden">
          <img src="tabby-cat.jpg" alt="Cat Image" />
          <button id="btn-delete-cat" class="btn btn-block btn-delete">
            Hide Result
          </button>
        </div>

        <div id="dog-img" class="card hidden">
          <img src="dog.jpg" alt="Dog Image" />
          <button id="btn-delete-dog" class="btn btn-block btn-delete">
            Hide Result
          </button>
        </div>

        <div id="cow-img" class="card hidden">
          <img src="cow.jpg" alt="Cow Image" />
          <button id="btn-delete-cow" class="btn btn-block btn-delete">
            Hide Result
          </button>
        </div>
      </div>
    </main>

    <footer class="site-footer">
      <button id="cat" class="btn">Reveal a CAT</button>
      <button id="dog" class="btn">Reveal a DOG</button>
      <button id="cow" class="btn">Reveal a COW</button>
    </footer>
    <script src="app.js"></script>
  </body>
</html>
